<!DOCTYPE html>
<html>
<head>
  <title>Foods List</title>
  <style>
    table, th, td {
      border: 1px solid black;
      padding: 8px;
    }
  </style>
</head>
<body>

<h2>Available Foods</h2>

<table id="foodsTable">
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Price</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  fetch("/foods")
    .then(res => res.json())
    .then(data => {
      const tableBody = document.querySelector("#foodsTable tbody");

      data.forEach(food => {
        const row = document.createElement("tr");

        row.innerHTML = `
          <td>${food.id}</td>
          <td>${food.name}</td>
          <td>${food.price}</td>
        `;

        tableBody.appendChild(row);
      });
    });
</script>

</body>
</html>
